name: Build Training Modpack DI Mixup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract DI Mixup source
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'UltimateTrainingModpack-DI-Mixup-13.0.4-fixed.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: UltimateTrainingModpack-DI-Mixup-13.0.4-fixed.zip not found."
            exit 1
          fi
          mkdir build
          unzip -q "$ZIP" -d build
          PROJECT=$(find build -maxdepth 2 -type f -name Cargo.toml -print -quit | xargs dirname)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: Cargo.toml not found."
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Source project: $PROJECT"
          find "$PROJECT" -type f -name Cargo.toml -exec sed -i 's|https://github.com/austintraver/skyline-smash.git|https://github.com/ultimate-research/skyline-smash.git|' {} +
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("build/UltimateTrainingModpack-7.0.0/src/training/mod.rs")
          s = p.read_text()
          s = s.replace("let x8 = ctx.registers[8].x.as_mut();", "")
          s = s.replace("*x8 = 0;", "ctx.registers[8].set_x(0);")
          s = s.replace("let x22 = ctx.registers[22].x.as_mut();", "")
          s = s.replace("(*x22) as *mut PauseMenu", "ctx.registers[22].x() as *mut PauseMenu")
          s = s.replace("let x1 = ctx.registers[1].x.as_mut();", "")
          s = s.replace("*x1 = on_text_ptr;", "ctx.registers[1].set_x(on_text_ptr);")
          p.write_text(s)
          ui = Path("build/UltimateTrainingModpack-7.0.0/src/training/ui/mod.rs")
          s = ui.read_text()
          s = s.replace("*ctx.registers[21].x.as_ref()", "ctx.registers[21].x()")
          s = s.replace("*ctx.registers[1].x.as_ref()", "ctx.registers[1].x()")
          s = s.replace("let decompressed_file = ctx.registers[21].x.as_mut();\n    *decompressed_file = inject_arc as u64;", "ctx.registers[21].set_x(inject_arc as u64);")
          s = s.replace("*ctx.registers[1].x.as_mut() = inject_arc_size;", "ctx.registers[1].set_x(inject_arc_size);")
          s = s.replace("*ctx.registers[23].x.as_mut() = inject_arc_size;", "ctx.registers[23].set_x(inject_arc_size);")
          s = s.replace("*ctx.registers[24].x.as_mut() = inject_arc_size;", "ctx.registers[24].set_x(inject_arc_size);")
          ui.write_text(s)
          pt = Path("build/UltimateTrainingModpack-7.0.0/src/training/character_specific/ptrainer.rs")
          s = pt.read_text()
          s = s.replace("let x20 = ctx.registers[20].x.as_mut();", "let x20 = ctx.registers[20].x();")
          s = s.replace("*x20 as *mut u64", "x20 as *mut u64")
          s = s.replace("let w8 = ctx.registers[8].w.as_mut();\n        *w8 = pokemon_value;", "ctx.registers[8].set_w(pokemon_value);")
          pt.write_text(s)
          PY
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          target: x86_64-unknown-linux-gnu
      - name: Install cargo-skyline with current target spec
        run: |
          git clone --depth 1 --branch patch-3 https://github.com/jugeeya/cargo-skyline /tmp/cargo-skyline
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/cargo-skyline/src/update_std.rs")
          s = p.read_text()
          replacements = {
              '"target-c-int-width": "32"': '"target-c-int-width": 32',
              '"target-pointer-width": "64"': '"target-pointer-width": 64',
              '"data-layout": "e-m:e-i8:8:32-i16:16:32-i64:64-i128:128-n32:64-S128-Fn32"': '"data-layout": "e-m:e-p270:32:32-p271:32:32-p272:64:64-i8:8:32-i16:16:32-i64:64-i128:128-n32:64-S128-Fn32"',
          }
          for old, new in replacements.items():
              assert old in s, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          cargo install --path /tmp/cargo-skyline --force
      - name: Install Skyline standard library
        run: cargo-skyline skyline update-std
      - name: Enable Cargo JSON target specs
        working-directory: ${{ env.PROJECT }}
        run: |
          printf '\n[unstable]\njson-target-spec = true\n' >> .cargo/config.toml
      - name: Build NRO
        working-directory: ${{ env.PROJECT }}
        env:
          RUSTFLAGS: -g
        run: cargo-skyline skyline build --release
      - name: Verify NRO
        working-directory: ${{ env.PROJECT }}
        run: |
          ls -lh target/aarch64-skyline-switch/release/libtraining_modpack.nro
          file target/aarch64-skyline-switch/release/libtraining_modpack.nro
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: libtraining_modpack-13.0.4-DI-Mixup
          path: ${{ env.PROJECT }}/target/aarch64-skyline-switch/release/libtraining_modpack.nro
          if-no-files-found: error
