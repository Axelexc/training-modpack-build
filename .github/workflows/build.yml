name: Build Training Modpack DI Mixup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract DI Mixup source
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'UltimateTrainingModpack-DI-Mixup-13.0.4-fixed.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: UltimateTrainingModpack-DI-Mixup-13.0.4-fixed.zip not found."
            exit 1
          fi
          mkdir build
          unzip -q "$ZIP" -d build
          PROJECT=$(find build -maxdepth 2 -type f -name Cargo.toml -print -quit | xargs dirname)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: Cargo.toml not found."
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Source project: $PROJECT"
          find "$PROJECT" -type f -name Cargo.toml -exec sed -i 's|https://github.com/austintraver/skyline-smash.git|https://github.com/ultimate-research/skyline-smash.git|' {} +
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build/UltimateTrainingModpack-7.0.0")
          skyline_rev = "b7fe5c7c297d83f1c63d9101a6e098cfda7fdb5b"
          smash_rev = "3fa74e3caec74011317c4c6402a22ee45112ab87"
          for p in root.rglob("Cargo.toml"):
              s = p.read_text()
              s = s.replace('https://github.com/austintraver/skyline-smash.git', 'https://github.com/ultimate-research/skyline-smash.git')
              s = s.replace('https://github.com/ultimate-research/skyline-smash.git" }', 'https://github.com/ultimate-research/skyline-smash.git", rev = "' + smash_rev + '" }')
              s = s.replace('https://github.com/ultimate-research/skyline-rs.git" }', 'https://github.com/ultimate-research/skyline-rs.git", rev = "' + skyline_rev + '" }')
              s = s.replace('https://github.com/ultimate-research/skyline-rs" }', 'https://github.com/ultimate-research/skyline-rs.git", rev = "' + skyline_rev + '" }')
              p.write_text(s)
          manifest = root / "Cargo.toml"
          s = manifest.read_text()
          PY
      - name: Install Rust nightly compatible with Skyline 7.0.0
        uses: dtolnay/rust-toolchain@nightly-2025-01-15
        with:
          target: x86_64-unknown-linux-gnu
      - name: Install cargo-skyline with current target spec
        run: |
          git clone --depth 1 --branch patch-3 https://github.com/jugeeya/cargo-skyline /tmp/cargo-skyline
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/cargo-skyline/src/update_std.rs")
          s = p.read_text()
          replacements = {
              '"target-c-int-width": "32"': '"target-c-int-width": 32',
              '"target-pointer-width": "64"': '"target-pointer-width": 64',
              '"data-layout": "e-m:e-i8:8:32-i16:16:32-i64:64-i128:128-n32:64-S128-Fn32"': '"data-layout": "e-m:e-p270:32:32-p271:32:32-p272:64:64-i8:8:32-i16:16:32-i64:64-i128:128-n32:64-S128-Fn32"',
          }
          for old, new in replacements.items():
              assert old in s, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          cargo install --path /tmp/cargo-skyline --force
      - name: Install Skyline standard library
        run: cargo-skyline skyline update-std
      - name: Enable Cargo JSON target specs
        working-directory: ${{ env.PROJECT }}
        run: |
          printf '\n[unstable]\njson-target-spec = true\n' >> .cargo/config.toml
      - name: Pin skyline-smash transitive Skyline dependency
        working-directory: ${{ env.PROJECT }}
        run: |
          cargo fetch
          SMASH_MANIFEST=$(find "$HOME/.cargo/git/checkouts" -path '*/skyline-smash-*/Cargo.toml' -print -quit)
          if [ -z "$SMASH_MANIFEST" ]; then
            echo "ERROR: skyline-smash Cargo.toml not found after cargo fetch."
            exit 1
          fi
          python3 - "$SMASH_MANIFEST" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          old = 'https://github.com/ultimate-research/skyline-rs" }'
          new = 'https://github.com/ultimate-research/skyline-rs.git", rev = "b7fe5c7c297d83f1c63d9101a6e098cfda7fdb5b" }'
          assert old in s
          p.write_text(s.replace(old, new))
          PY
      - name: Build NRO
        working-directory: ${{ env.PROJECT }}
        env:
          RUSTFLAGS: -g
        run: cargo-skyline skyline build --release
      - name: Verify NRO
        working-directory: ${{ env.PROJECT }}
        run: |
          ls -lh target/aarch64-skyline-switch/release/libtraining_modpack.nro
          file target/aarch64-skyline-switch/release/libtraining_modpack.nro
      - name: Package matching Skyline dependencies
        working-directory: ${{ env.PROJECT }}
        run: |
          PLUGINS="$GITHUB_WORKSPACE/dist/atmosphere/contents/01006A800016E000/romfs/skyline/plugins"
          mkdir -p "$PLUGINS"
          cp target/aarch64-skyline-switch/release/libtraining_modpack.nro "$PLUGINS/"
          curl -fL https://github.com/ultimate-research/nro-hook-plugin/releases/download/v0.4.0/libnro_hook.nro -o "$PLUGINS/libnro_hook.nro"
          curl -fL https://github.com/ultimate-research/params-hook-plugin/releases/download/v0.1.1/libparam_hook.nro -o "$PLUGINS/libparam_hook.nro"
          cat > "$GITHUB_WORKSPACE/dist/INSTALL.txt" <<'EOF'
          Copy the atmosphere folder to the root of the SD card and merge it with the existing atmosphere folder. This package includes the Training Modpack plus its Skyline dependencies.
          EOF

      - name: Upload complete SD plugin package
        uses: actions/upload-artifact@v4
        with:
          name: training-modpack-7.0.0-DI-Mixup-SD-package
          path: dist/**
          if-no-files-found: error
